services:
  db:
    image: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: teamspeak
    volumes:
      - db_data:/var/lib/mysql

  teamspeak:
    image: teamspeak
    restart: always
    depends_on:
      - db
    volumes:
      - ./query_ip_allowlist.txt:/var/ts3server/query_ip_allowlist.txt
    ports:
      - 9987:9987/udp
      - 10011:10011
      - 30033:30033
    environment:
      TS3SERVER_DB_PLUGIN: ts3db_mariadb
      TS3SERVER_DB_SQLCREATEPATH: create_mariadb
      TS3SERVER_DB_HOST: db
      TS3SERVER_DB_USER: root
      TS3SERVER_DB_PASSWORD: ${DB_ROOT_PASSWORD}
      TS3SERVER_DB_NAME: teamspeak
      TS3SERVER_DB_WAITUNTILREADY: 30
      TS3SERVER_LICENSE: accept
      TS3SERVER_SERVERADMIN_PASSWORD: ${TS3_SERVERADMIN_PASSWORD}
    networks:
      - default
      - atis     # lets the ATIS bot and agent reach the server (unused without the atis profile)

  ts3init:
    image: python:3.12-alpine
    restart: "no"
    depends_on:
      - teamspeak
    environment:
      TS3_SERVERADMIN_PASSWORD: ${TS3_SERVERADMIN_PASSWORD}
      TS3_VORSTAND_PASSWORD: ${TS3_VORSTAND_PASSWORD:?set a password for the Vorstand channel in .env}
      TS3_WELCOME_MESSAGE: ${TS3_WELCOME_MESSAGE:-}
      TS3_SERVER_NAME: ${TS3_SERVER_NAME:-}
    volumes:
      - ./ts3init.py:/ts3init.py:ro
    command: python3 /ts3init.py

  tsapi:
    build: ./tsquery_api
    image: joeherwig/joinfs-tsapi:latest
    depends_on:
      teamspeak:
        condition: service_started
      ts3init:
        condition: service_completed_successfully
    environment:
      TS3_QUERY_HOST: teamspeak
      TS3_QUERY_PORT: "10011"
      TS3_QUERY_USER: serveradmin
      TS3_QUERY_PASSWORD: ${TS3_SERVERADMIN_PASSWORD}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      ATC_CHANNEL_STALE_TIMEOUT: ${ATC_CHANNEL_STALE_TIMEOUT:-10800}

  # --- ATIS agent (optional; enable with `docker compose --profile atis up -d`) -----------------------
  # Reads the description of every *_ATIS channel, renders it with Piper and has a bot loop it in the channel.
  # Neither service publishes a port. They sit on their own network with FIXED addresses: the bot's web API has no
  # token, it only accepts requests from the agent's address (ATIS_AGENT_IP below must equal the agent's address).
  ts3audiobot:
    profiles: ["atis"]
    image: ${ATIS_BOT_IMAGE:-joeherwig/joinfs-ts3audiobot:0.1.1}
    restart: unless-stopped
    depends_on:
      - teamspeak
    environment:
      TS3_ADDRESS: teamspeak
      ATIS_AGENT_IP: 172.28.200.10
    volumes:
      - atis_audio:/data/audio:ro
    read_only: true
    tmpfs: ["/tmp", "/home/ts3ab"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    networks:
      atis: {ipv4_address: 172.28.200.11}

  atis-agent:
    profiles: ["atis"]
    image: ${ATIS_AGENT_IMAGE:-joeherwig/joinfs-atis-agent:0.1.1}
    restart: unless-stopped
    depends_on:
      - teamspeak
      - ts3audiobot
    environment:
      TS3_QUERY_HOST: teamspeak
      TS3_QUERY_PORT: "10011"
      TS3_QUERY_USER: serveradmin
      TS3_QUERY_PASSWORD: ${TS3_SERVERADMIN_PASSWORD}
      ATIS_BOT_URL: http://172.28.200.11:58913
      ATIS_VOICE_MAP: ${ATIS_VOICE_MAP:-}
      ATIS_LEAVE_DELAY: ${ATIS_LEAVE_DELAY:-30}
      ATIS_MAX_IDLE: ${ATIS_MAX_IDLE:-0}
    volumes:
      - atis_audio:/data/audio
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    networks:
      atis: {ipv4_address: 172.28.200.10}

  joinfs:
    image: joeherwig/joinfs-console:latest

    container_name: joinfs
    command:
      - --hub
      - --hubdomain
      - "${JOINFS_HUB_DOMAIN}"
      - --nosim
      - --hubname
      - "${JOINFS_HUB_NAME}"
      - --hubport
      - "6112"
      - --background
      - --nogui
      - --whazzup
      - --websocket
      - --websocketport
      - "8765"
      - --comswebhookuri
      - "http://tsapi:8081/usertochannel"
      - --comswebhookmethod
      - PUT
      - --websocketlog
    volumes:
      - joinfs_data:/JoinFS-CONSOLE/JoinFS-CONSOLE
    ports:
      - "6112:6112/udp"
    restart: unless-stopped
    depends_on:
      - teamspeak
      - tsapi

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - tsapi
      - joinfs
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  atis:
    ipam:
      config:
        - subnet: 172.28.200.0/24

volumes:
  db_data:
  joinfs_data:
  atis_audio:
  caddy_data:
  caddy_config:
